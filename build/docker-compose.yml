version: '3.8'

# DuckDB Multi-Protocol Server Docker Compose
# 支持开发、测试、生产环境部署

services:
  # 主服务
  duckdb-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: duckdb-server:latest
    container_name: duckdb-server
    ports:
      - "${HTTP_PORT:-8080}:8080"   # HTTP API
      - "${MYSQL_PORT:-3366}:3366"  # MySQL Protocol
    volumes:
      - ./config.json:/app/config.json:ro
      - duckdb_data:/app/data
      - ./logs:/app/logs
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - DB_PATH=${DB_PATH:-/app/data/duckdb.db}
    restart: unless-stopped
    networks:
      - duckdb-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.duckdb.rule=Host(`duckdb.local`)"
      - "traefik.http.services.duckdb.loadbalancer.server.port=8080"

  # 负载均衡器 (Nginx)
  nginx:
    image: nginx:alpine
    container_name: duckdb-nginx
    ports:
      - "${NGINX_PORT:-80}:80"
      - "${NGINX_SSL_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - duckdb-server
    networks:
      - duckdb-network
    restart: unless-stopped
    profiles:
      - production
      - loadbalancer

  # Redis缓存 (可选)
  redis:
    image: redis:7-alpine
    container_name: duckdb-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/etc/redis/redis.conf:ro
    command: redis-server /etc/redis/redis.conf
    networks:
      - duckdb-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
    profiles:
      - production
      - cache

  # Prometheus监控
  prometheus:
    image: prom/prometheus:latest
    container_name: duckdb-prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--storage.tsdb.retention.time=30d'
    networks:
      - duckdb-network
    restart: unless-stopped
    depends_on:
      - duckdb-server
    profiles:
      - monitoring
    deploy:
      resources:
        limits:
          memory: 512M

  # Grafana仪表板
  grafana:
    image: grafana/grafana:latest
    container_name: duckdb-grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/plugins:/var/lib/grafana/plugins
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin123}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    networks:
      - duckdb-network
    restart: unless-stopped
    depends_on:
      - prometheus
    profiles:
      - monitoring
    deploy:
      resources:
        limits:
          memory: 256M

  # 日志收集 (Fluentd)
  fluentd:
    image: fluent/fluentd:v1.16-debian-1
    container_name: duckdb-fluentd
    volumes:
      - ./logging/fluent.conf:/fluentd/etc/fluent.conf:ro
      - ./logs:/var/log/app:ro
      - fluentd_data:/fluentd/log
    ports:
      - "${FLUENTD_PORT:-24224}:24224"
    networks:
      - duckdb-network
    restart: unless-stopped
    profiles:
      - logging
    deploy:
      resources:
        limits:
          memory: 256M

  # 测试客户端
  test-client:
    image: ubuntu:22.04
    container_name: duckdb-test-client
    volumes:
      - .:/workspace
    working_dir: /workspace
    command: >
      bash -c "
        apt-get update && 
        apt-get install -y curl jq python3 python3-pip mysql-client netcat-openbsd &&
        pip3 install requests pymysql &&
        echo '=== DuckDB Test Client Ready ===' &&
        echo 'HTTP API: curl http://duckdb-server:8080/health' &&
        echo 'MySQL: mysql -h duckdb-server -P 3366 -u root' &&
        echo 'Interactive: docker exec -it duckdb-test-client bash' &&
        tail -f /dev/null
      "
    networks:
      - duckdb-network
    depends_on:
      - duckdb-server
    profiles:
      - testing
      - development

  # 数据库备份服务
  backup:
    image: alpine:latest
    container_name: duckdb-backup
    volumes:
      - duckdb_data:/data:ro
      - ./backups:/backups
      - ./scripts/backup.sh:/backup.sh:ro
    environment:
      - BACKUP_SCHEDULE=${BACKUP_SCHEDULE:-0 2 * * *}  # 每天2点备份
      - BACKUP_RETENTION=${BACKUP_RETENTION:-7}        # 保留7天
    command: >
      sh -c "
        apk add --no-cache dcron &&
        echo '${BACKUP_SCHEDULE:-0 2 * * *} /backup.sh' | crontab - &&
        crond -f
      "
    networks:
      - duckdb-network
    restart: unless-stopped
    profiles:
      - production
      - backup

# 数据卷
volumes:
  duckdb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_DIR:-./data}
  
  prometheus_data:
    driver: local
  
  grafana_data:
    driver: local
  
  redis_data:
    driver: local
  
  fluentd_data:
    driver: local
  
  nginx_logs:
    driver: local

# 网络
networks:
  duckdb-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16 