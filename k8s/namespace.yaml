apiVersion: v1
kind: Namespace
metadata:
  name: duckdb-system
  labels:
    name: duckdb-system
    app: duckdb-server
    version: v1.0.0
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: duckdb-quota
  namespace: duckdb-system
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi
    persistentvolumeclaims: "10"
    services: "5"
    secrets: "10"
    configmaps: "10"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: duckdb-limits
  namespace: duckdb-system
spec:
  limits:
  - default:
      cpu: "1"
      memory: "2Gi"
    defaultRequest:
      cpu: "100m"
      memory: "256Mi"
    type: Container 